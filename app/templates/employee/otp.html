{% extends "base.html" %}
{% block content %}
<div class="card" style="margin-top:40px">
  <h2 style="text-align:center;margin-bottom:12px">הזן קוד</h2>
  <p style="text-align:center;color:#666;margin-bottom:20px;font-size:0.9rem">
    נשלח קוד למספר {{ phone }}
  </p>
  <form method="post" action="/login/verify-otp">
    <input type="hidden" name="phone" value="{{ phone }}">
    <input type="text" name="otp" placeholder="000000" required maxlength="6" dir="ltr" style="text-align:center;font-size:1.5rem;letter-spacing:8px">
    <button type="submit" class="btn btn-primary">אישור</button>
  </form>
</div>
{% endblock %}
